name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: mypy app
      - run: pytest -q
        env:
          AIRLOCK_LLM_PROVIDER: dummy
          AIRLOCK_SANDBOX_BACKEND: dummy
      - run: python -m app.eval.benchmark eval_cases/cases.yaml
        env:
          AIRLOCK_LLM_PROVIDER: dummy
          AIRLOCK_SANDBOX_BACKEND: dummy

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node scripts/contrast-audit.mjs
