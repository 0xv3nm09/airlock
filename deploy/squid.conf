# Registry-only egress for the install phase.
http_port 3128
acl registries dstdomain pypi.org files.pythonhosted.org registry.npmjs.org
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow registries
http_access deny all
logformat airlock %ts.%03tu %>a %rm %ru %>Hs %Ss
access_log /var/log/squid/access.log airlock
